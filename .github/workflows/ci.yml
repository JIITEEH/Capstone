name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  check:
    name: Lint, test, and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the oldest supported version; 24 is the current LTS
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Opens every page as each role in Chrome, which GitHub's Ubuntu runners already have.
      # Once is enough, so only on the newest Node.
      - name: Browser smoke tests
        if: matrix.node == '24'
        run: npm run e2e -w client

      - name: Keep the browser test report
        if: failure() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
